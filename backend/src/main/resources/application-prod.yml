# 容器/生产环境：DB、Redis 的地址和密码全部通过环境变量注入，不硬编码
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:recipe_menu}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:menu}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MenuHikariPool
      minimum-idle: 2
      maximum-pool-size: 20
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 1500ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 2
          max-wait: 3s

logging:
  level:
    root: INFO
    com.fengxue.menu: INFO

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
