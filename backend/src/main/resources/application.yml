server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: menu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  packages-to-scan: com.fengxue.menu.controller,com.fengxue.menu.auth,com.fengxue.menu.recipe,com.fengxue.menu.category,com.fengxue.menu.importer,com.fengxue.menu.ai,com.fengxue.menu.preference,com.fengxue.menu.menu

logging:
  file:
    name: ${LOG_DIR:logs}/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:logs}/app.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: true
  level:
    root: INFO
    com.fengxue.menu: INFO
    org.springframework: INFO

app:
  jwt:
    secret-file: ${JWT_SECRET_FILE:data/jwt.secret}
    expire-days: ${JWT_EXPIRE_DAYS:7}
  ai:
    master-key-file: ${AI_KEY_MASTER_FILE:data/secret.key}
  integration:
    # 每天 06:00（Asia/Shanghai）扫描 B 站收藏夹 / 抖音待处理链接
    scan-cron: ${INTEGRATION_SCAN_CRON:0 0 6 * * *}
  storage:
    upload-dir: ${UPLOAD_DIR:data/uploads}
    max-image-bytes: ${MAX_IMAGE_BYTES:5242880}
  import:
    timeout-seconds: ${IMPORT_TIMEOUT_SECONDS:8}
    max-bytes: ${IMPORT_MAX_BYTES:2097152}
    max-redirects: ${IMPORT_MAX_REDIRECTS:3}
  cors:
    # 前端开发服务器可能通过 localhost、127.0.0.1、局域网 IP、主机名访问；
    # 默认放行本机与私有网段，生产环境用 CORS_ORIGINS 收紧。
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
