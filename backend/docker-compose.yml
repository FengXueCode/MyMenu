# 文件：docker-compose.yml
# 一键启动：docker compose up -d --build
# 查看状态：docker compose ps
# 查看日志：docker compose logs -f app
# 停止并删除容器：docker compose down
# 停止并删除数据卷（会重新执行 init.sql）：docker compose down -v

name: springboot-template

services:
  mysql:
    image: mysql:8.4
    container_name: template-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-template}
      MYSQL_USER: ${MYSQL_USER:-template}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-template123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - template-net

  redis:
    image: redis:7.4
    container_name: template-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-redis123456}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - template-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: springboot-template:1.0.0
    container_name: template-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-template}
      DB_USERNAME: ${MYSQL_USER:-template}
      DB_PASSWORD: ${MYSQL_PASSWORD:-template123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      REDIS_DATABASE: "0"
      LOG_DIR: /app/logs
      TZ: Asia/Shanghai
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/app/logs
    stop_grace_period: 30s
    networks:
      - template-net

volumes:
  mysql-data:
    name: template-mysql-data
  redis-data:
    name: template-redis-data
  app-logs:
    name: template-app-logs

networks:
  template-net:
    name: template-net
    driver: bridge
